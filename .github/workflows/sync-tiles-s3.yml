name: Sync tiles to S3/R2

# Opt-in only. Do not add a schedule — uploads need secrets and are manual.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (list/copy with --dryrun, no persist)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  sync:
    name: Upload public/tiles/*.pmtiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync PMTiles (skip if secrets missing)
        env:
          TILES_S3_ENDPOINT: ${{ secrets.TILES_S3_ENDPOINT }}
          TILES_S3_BUCKET: ${{ secrets.TILES_S3_BUCKET }}
          TILES_S3_PREFIX: ${{ secrets.TILES_S3_PREFIX }}
          TILES_S3_REGION: ${{ secrets.TILES_S3_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TILES_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TILES_S3_SECRET_ACCESS_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          extra=()
          if [ "$DRY_RUN" = "true" ]; then
            extra+=(--dry-run)
          fi
          bash scripts/sync-tiles-s3.sh "${extra[@]}"
