name: Overlay live refresh

on:
  workflow_dispatch:

permissions:
  contents: read

# pg_cron is primary (job overlay-live-refresh, every 15 minutes).
# This workflow is a manual fallback only. The */15 schedule was removed
# so a filled OVERLAY_REFRESH_URL cannot run beside pg_cron.
# Guard: the job runs only on workflow_dispatch.
# Produksi tidak berubah sampai berkas ini ada di default branch.

concurrency:
  group: overlay-live-refresh
  cancel-in-progress: false

jobs:
  refresh-supabase:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && vars.OVERLAY_REFRESH_URL != '' }}
    steps:
      - name: Trigger deployed overlay live refresh
        env:
          OVERLAY_CRON_SECRET: ${{ secrets.OVERLAY_CRON_SECRET }}
          OVERLAY_REFRESH_URL: ${{ vars.OVERLAY_REFRESH_URL }}
        run: |
          if [ -z "$OVERLAY_CRON_SECRET" ]; then
            echo "OVERLAY_CRON_SECRET not set — skip overlay live refresh"
            exit 0
          fi
          curl -fsS -X POST "$OVERLAY_REFRESH_URL" \
            -H "Authorization: Bearer $OVERLAY_CRON_SECRET" \
            -H "Content-Type: application/json"
