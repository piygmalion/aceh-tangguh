name: Daily Brief cron

on:
  schedule:
    # 07:00 WIB (Asia/Jakarta, UTC+7)
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

# POSTs POST /api/cron/daily-brief.
# Skip-if-unset (same pattern as laporan-wa.yml):
# - job is skipped when vars.DAILY_BRIEF_URL is empty
# - if DAILY_BRIEF_CRON_SECRET is empty, echo a skip message and exit 0

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    if: ${{ vars.DAILY_BRIEF_URL != '' }}
    steps:
      - name: POST daily brief cron
        env:
          DAILY_BRIEF_CRON_SECRET: ${{ secrets.DAILY_BRIEF_CRON_SECRET }}
          DAILY_BRIEF_URL: ${{ vars.DAILY_BRIEF_URL }}
        run: |
          if [ -z "$DAILY_BRIEF_CRON_SECRET" ]; then
            echo "DAILY_BRIEF_CRON_SECRET not set — skip daily brief cron"
            exit 0
          fi
          curl -fsS -X POST "$DAILY_BRIEF_URL" \
            -H "Authorization: Bearer $DAILY_BRIEF_CRON_SECRET" \
            -H "Content-Type: application/json"
