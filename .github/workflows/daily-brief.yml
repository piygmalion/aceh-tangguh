name: Daily Brief cron

on:
  workflow_dispatch:

permissions:
  contents: read

# Cadangan manual. Penjadwal otomatis adalah pg_cron job daily-brief-daily
# (supabase/migrations/20261111_daily_brief_pg_cron.sql), 07.00 WIB.
# Guard: job hanya jalan pada workflow_dispatch. Jangan menambah schedule
# selama job pg_cron itu aktif, supaya dua penjadwal tidak memanggil
# POST /api/cron/daily-brief berdekatan.
# Produksi tidak berubah sampai berkas ini ada di default branch.

concurrency:
  group: daily-brief-cron
  cancel-in-progress: false

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && vars.DAILY_BRIEF_URL != '' }}
    steps:
      - name: POST daily brief cron
        env:
          DAILY_BRIEF_CRON_SECRET: ${{ secrets.DAILY_BRIEF_CRON_SECRET }}
          DAILY_BRIEF_URL: ${{ vars.DAILY_BRIEF_URL }}
        run: |
          if [ -z "$DAILY_BRIEF_CRON_SECRET" ]; then
            echo "DAILY_BRIEF_CRON_SECRET not set — skip daily brief cron"
            exit 0
          fi
          curl -fsS -X POST "$DAILY_BRIEF_URL" \
            -H "Authorization: Bearer $DAILY_BRIEF_CRON_SECRET" \
            -H "Content-Type: application/json"
